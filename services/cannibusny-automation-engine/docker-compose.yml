services:
  api:
    build: .
    image: cannibusny-automation-engine
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
